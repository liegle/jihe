[workspace]
resolver = "3"
members = [ "jihe-*" ]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
encase = "0.12"
env_logger = "0.11"
glam = { version = "0.33", features = ["encase"]}
log = "0.4"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt", "sync", "time"] }
wgpu = "29.0"
wgpu-profiler = "0.27"
winit = "0.30"
